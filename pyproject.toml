[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abstractagent"
version = "0.3.14"
description = "Agent implementations using AbstractRuntime and AbstractCore"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "abstractcore[tools]>=2.13.41",
    "abstractruntime>=0.5.0",
]

[project.optional-dependencies]
apple = [
    "abstractcore[all-apple]>=2.13.41",
    "abstractruntime[apple]>=0.5.0",
]
gpu = [
    "abstractcore[all-gpu]>=2.13.41",
    "abstractruntime[gpu]>=0.5.0",
]
dev = [
    "pytest>=7.0",
    "jinja2>=3.1",
]
test = [
    "pytest>=7.0",
    # Renders the vendored Qwen3.6 chat template (tests/test_announced_tool_reprompt.py).
    "jinja2>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
react-agent = "abstractagent.repl:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "basic: Level A (contract/unit) tests",
    "integration: Level B (integration/local) tests",
    "e2e: Level C (end-to-end/real infra) tests (opt-in)",
]
