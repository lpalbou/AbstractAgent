[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abstractagent"
version = "0.3.3"
description = "Agent implementations using AbstractRuntime and AbstractCore"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "abstractcore[tools]>=2.13.12",
    "abstractruntime>=0.4.8",
]

[project.optional-dependencies]
apple = [
    "abstractcore[apple]>=2.13.12",
    "abstractruntime[apple]>=0.4.8",
]
gpu = [
    "abstractcore[gpu]>=2.13.12",
    "abstractruntime[gpu]>=0.4.8",
]
all-apple = [
    "abstractcore[all-apple]>=2.13.12",
    "abstractruntime[all-apple]>=0.4.8",
]
all-gpu = [
    "abstractcore[all-gpu]>=2.13.12",
    "abstractruntime[all-gpu]>=0.4.8",
]
dev = [
    "pytest>=7.0",
]
test = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
react-agent = "abstractagent.repl:main"

[tool.pytest.ini_options]
markers = [
    "basic: Level A (contract/unit) tests",
    "integration: Level B (integration/local) tests",
    "e2e: Level C (end-to-end/real infra) tests (opt-in)",
]
